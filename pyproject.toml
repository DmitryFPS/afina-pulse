[project]
name = "afina-watch"
version = "0.1.0"
description = "Keyword + semantic monitor for Telegram (via afina-tdl Relay) and Facebook, with local media understanding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Afina Watch" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aiokafka>=0.11",
  "pymongo>=4.8",
  "motor>=3.5",
  "ollama>=0.3",
  "faster-whisper>=1.0",
  "pillow>=10.4",
  "numpy>=2.0",
  "aiosqlite>=0.20",
  "orjson>=3.10",
  "python-dotenv>=1.0",
  "tenacity>=8.5",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.3", "pytest-asyncio>=0.24"]
browser = ["playwright>=1.47"]
embed-local = ["sentence-transformers>=3.0"]
ocr = ["pytesseract>=0.3.13"]

[project.scripts]
afina-watch = "afina_watch.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["afina_watch*"]

[tool.ruff]
line-length = 100
target-version = "py311"
